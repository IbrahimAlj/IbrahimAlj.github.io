    <div class="fact">
      <strong>Did you know?</strong><br>
      Octopuses have <em>three hearts</em> and <em>blue blood</em>.
      Two hearts pump blood to the gills, and the third pumps it to the rest of the body —
      but that third heart stops beating when they swim, which is why they prefer crawling.
