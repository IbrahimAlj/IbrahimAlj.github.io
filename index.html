    <h1>Fun Fact of the Day</h1>

    <img src="https://th-thumbnailer.cdn-si-edu.com/D8H0DAaeSXpbVVYgbINArUzJh1Y=/1024x680/filters:no_upscale()/https://tf-cmsv2-smithsonianmag-media.s3.amazonaws.com/filer/2b/b2/2bb2620f-db2f-419b-9f4e-28f0d7c6bc75/octopus.jpg" alt="Octopus" width="400">

    <p>Did you know? Octopuses have three hearts and blue blood. Two hearts pump blood to the gills, and the third pumps it to the rest of the body. The third
  heart stops beating when they swim, which is why they prefer crawling.</p>
